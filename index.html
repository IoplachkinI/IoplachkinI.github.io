<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IoplachkinI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --fg: #e8e6e3;
      --muted: #9a968f;
      --line: #2a2d34;
      --accent: #7eb8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.5 ui-sans-serif, system-ui, sans-serif;
    }

    main {
      width: min(36rem, calc(100% - 2.5rem));
      padding-bottom: 8vh;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: 2.25rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    p { margin: 0; color: var(--muted); }

    nav {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>IoplachkinI</h1>
    <p>Personal site.</p>
    <nav>
      <a href="https://github.com/IoplachkinI">GitHub</a>
    </nav>
  </main>
</body>
</html>
